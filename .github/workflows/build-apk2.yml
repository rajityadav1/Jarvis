name: Build Jarvis APK 2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | sudo env JAVA_HOME="$JAVA_HOME" "$SDKM" --licenses > /dev/null || true
          sudo env JAVA_HOME="$JAVA_HOME" "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Create debug key
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.config" "$HOME/.android" 2>/dev/null || true
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project
        run: |
          for z in jarvis-android*.zip; do unzip -o "$z"; done

      - name: Build APK
        working-directory: android
        env:
          ANDROID_USER_HOME: ${{ github.workspace }}/.androidhome
        run: |
          mkdir -p "$ANDROID_USER_HOME"
          cp ~/.android/debug.keystore "$ANDROID_USER_HOME/debug.keystore"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Jarvis.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-v${{ github.run_number }}
          name: Jarvis app v${{ github.run_number }}
          files: Jarvis.apk
          
